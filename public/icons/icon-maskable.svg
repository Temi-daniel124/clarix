<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Clarix">
  <!-- Maskable app icon: full-bleed night indigo so any platform mask (circle, squircle)
       stays on brand, with the ring scaled to 80% so its outer edge (radius 134) sits well
       inside the 205px safe-zone circle. Rendered to icon-maskable-512.png. -->
  <rect width="512" height="512" fill="#0B1033"/>
  <circle cx="256" cy="256" r="107.52" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="53.76"/>
  <circle cx="256" cy="256" r="107.52" fill="none" stroke="#2BD19A" stroke-width="53.76" stroke-linecap="round" stroke-dasharray="450.38 675.57" transform="rotate(-90 256 256)"/>
</svg>
