<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Clarix">
  <!-- Maskable variant: same mark, pulled inside the 80% safe zone so platform masks
       (circle, squircle, rounded square) never clip the meter ring. -->
  <rect width="512" height="512" fill="#0B1220"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="35"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#16A57A" stroke-width="35" stroke-linecap="round"
          stroke-dasharray="435.9 653.5" transform="rotate(-90 256 256)"/>
</svg>
