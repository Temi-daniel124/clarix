<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Clarix">
  <!-- Apple touch icon source: full-bleed, because iOS applies its own rounded mask. Next.js
       only serves apple-icon as PNG/JPG, so scripts/brand/render-icons.mjs renders this file
       to apple-icon.png beside it. -->
  <rect width="180" height="180" fill="#0B1033"/>
  <circle cx="90" cy="90" r="47.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="23.62"/>
  <circle cx="90" cy="90" r="47.25" fill="none" stroke="#2BD19A" stroke-width="23.62" stroke-linecap="round" stroke-dasharray="197.92 296.88" transform="rotate(-90 90 90)"/>
</svg>
