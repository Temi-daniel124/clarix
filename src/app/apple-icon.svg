<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Clarix">
  <!-- Apple touch icon: the same meter ring, inset for iOS's own corner masking. -->
  <rect width="180" height="180" fill="#0B1220"/>
  <circle cx="90" cy="90" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="15"/>
  <circle cx="90" cy="90" r="46" fill="none" stroke="#16A57A" stroke-width="15" stroke-linecap="round"
          stroke-dasharray="192.8 289.0" transform="rotate(-90 90 90)"/>
</svg>
