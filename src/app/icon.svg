<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Clarix">
  <!-- Favicon from the Adire brand sheet: a night-indigo square with the emerald meter arc,
       two-thirds committed. Rendered at 16px or smaller, the track drops out and the arc
       thickens (the sheet's 16px drawing); SVG media queries measure the icon's own size. -->
  <style>
    @media (max-width: 24px) {
      .tile { rx: 7px; }
      .track { display: none; }
      .arc { stroke-width: 5.2px; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" fill="#0B1033"/>
  <circle class="track" cx="16" cy="16" r="8.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4.2"/>
  <circle class="arc" cx="16" cy="16" r="8.4" fill="none" stroke="#2BD19A" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="35.19 52.78" transform="rotate(-90 16 16)"/>
</svg>
